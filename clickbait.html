    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HEADLINE_GALLERY = [
            { category: 'curiosity', text: "You won't believe what happened when this dog met a dolphin!", clickbait: true },
            { category: 'curiosity', text: "The shocking secret doctors don't want you to know about sleep.", clickbait: true },
            { category: 'curiosity', text: "She opened a 100-year-old safe in her attic and found THIS.", clickbait: true },
            { category: 'curiosity', text: "Scientists opened a door under Antarctic ice. What they found surprised everyone.", clickbait: true },
            { category: 'curiosity', text: "This one simple daily habit will change your entire career forever.", clickbait: true },
            { category: 'curiosity', text: "He thought it was just a regular rock until he turned it over.", clickbait: true },

            { category: 'listicle', text: "10 mind-blowing travel hacks that will make you rethink flying forever!", clickbait: true },
            { category: 'listicle', text: "7 warning signs your diet is secretly ruining your health.", clickbait: true },
            { category: 'listicle', text: "15 shocking celebrity transformations you have to see to believe.", clickbait: true },
            { category: 'listicle', text: "Top 5 hidden features on your smartphone you had no idea existed.", clickbait: true },
            { category: 'listicle', text: "9 simple tricks financial advisors use to build wealth effortlessly.", clickbait: true },
            { category: 'listicle', text: "12 unbelievable places on Earth that look like another planet.", clickbait: true },

            { category: 'outrage', text: "Everyone is furious about this company's massive scandal and here's why!", clickbait: true },
            { category: 'outrage', text: "The heartbreaking truth about your favorite childhood TV shows.", clickbait: true },
            { category: 'outrage', text: "People are losing their minds over this viral recipe trend.", clickbait: true },
            { category: 'outrage', text: "Why nobody is talking about this alarming new economic threat.", clickbait: true },
            { category: 'outrage', text: "This outrageous video is breaking the internet and sparking total outrage.", clickbait: true },
            { category: 'outrage', text: "The dark side of coffee consumption that nobody is warning you about.", clickbait: true },

            { category: 'factual', text: "Federal Reserve announces 25 basis point interest rate adjustment.", clickbait: false },
            { category: 'factual', text: "NASA James Webb Space Telescope detects atmospheric water vapor on exoplanet.", clickbait: false },
            { category: 'factual', text: "Global climate summit concludes with renewable energy investment agreement.", clickbait: false },
            { category: 'factual', text: "European Central Bank publishes quarterly report on inflation projections.", clickbait: false },
            { category: 'factual', text: "Researchers publish study on ocean currents and temperature fluctuations.", clickbait: false },
            { category: 'factual', text: "Ministry of Health issues updated guidelines for seasonal flu vaccinations.", clickbait: false },

            { category: 'disagree', text: "5 unexpected reasons why tea might actually be better for focus than coffee.", clickbait: true, disagreeTag: true },
            { category: 'disagree', text: "Scientists reveal why sleep deprivation affects short-term memory performance.", clickbait: false, disagreeTag: true },
            { category: 'disagree', text: "Why electric vehicles could dominate public transport by the end of the decade.", clickbait: false, disagreeTag: true },
            { category: 'disagree', text: "The unusual science behind how migratory birds navigate cross-continental distances.", clickbait: false, disagreeTag: true }
        ];

        function VerdictOrb({ prediction, confidence, tintHex = null }) {
            const containerRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current || typeof THREE === 'undefined') return;

                const width = containerRef.current.clientWidth || 110;
                const height = containerRef.current.clientHeight || 110;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
                camera.position.z = 4.2;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(width, height);

                containerRef.current.appendChild(renderer.domElement);

                const isClickbait = prediction === 'CLICKBAIT';
                let orbColor = isClickbait ? 0xEF4444 : 0x10B981;
                if (tintHex) orbColor = parseInt(tintHex.replace('#', ''), 16);

                const light = new THREE.DirectionalLight(0xffffff, 1.2);
                light.position.set(5, 5, 5);
                scene.add(light, new THREE.AmbientLight(0xffffff, 0.6));

                const geometry = new THREE.IcosahedronGeometry(1.25, 3);
                const originalPositions = geometry.attributes.position.clone();

                const material = new THREE.MeshStandardMaterial({
                    color: orbColor,
                    roughness: 0.3,
                    metalness: 0.2,
                    wireframe: isClickbait
                });

                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                let reqId;
                let frame = 0;

                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    frame += 0.03;

                    const pos = geometry.attributes.position;
                    const orig = originalPositions;
                    const noise = isClickbait ? (0.08 + confidence * 0.12) : 0.04;

                    for (let i = 0; i < pos.count; i++) {
                        const vx = orig.getX(i);
                        const vy = orig.getY(i);
                        const vz = orig.getZ(i);
                        const disp = Math.sin(frame + vx * 3 + vy * 3) * noise;
                        pos.setXYZ(i, vx + vx * disp, vy + vy * disp, vz + vz * disp);
                    }
                    pos.needsUpdate = true;

                    mesh.rotation.x += 0.008;
                    mesh.rotation.y += 0.012;

                    renderer.render(scene, camera);
                };

                animate();

                return () => {
                    cancelAnimationFrame(reqId);
                    if (containerRef.current) containerRef.current.innerHTML = '';
                    geometry.dispose();
                    material.dispose();
                    renderer.dispose();
                };
            }, [prediction, confidence, tintHex]);

            return (
                <div className="w-24 h-24 sm:w-28 sm:h-28 relative flex items-center justify-center shrink-0">
                    <div ref={containerRef} className="w-full h-full" />
                    <div className="absolute inset-0 flex items-center justify-center font-mono font-extrabold text-white text-xs sm:text-sm drop-shadow-md pointer-events-none">
                        {(confidence * 100).toFixed(0)}%
                    </div>
                </div>
            );
        }

        function App() {
            // State
            const [selectedModel, setSelectedModel] = useState('tfidf'); // tfidf | distilbert | compare
            const [headline, setHeadline] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [predictResult, setPredictResult] = useState(null);

            // Gallery
            const [activeCategory, setActiveCategory] = useState('all');
            const [galleryItems, setGalleryItems] = useState(HEADLINE_GALLERY);

            // Adversarial
            const [advHeadline, setAdvHeadline] = useState('');
            const [advModel, setAdvModel] = useState('tfidf');
            const [attackType, setAttackType] = useState('substitution');
            const [isAdvTesting, setIsAdvTesting] = useState(false);
            const [advResult, setAdvResult] = useState(null);

            // Explainability
            const [xaiHeadline, setXaiHeadline] = useState('');
            const [isExplaining, setIsExplaining] = useState(false);
            const [xaiResult, setXaiResult] = useState(null);

            // Gemini Suite
            const [geminiHeadline, setGeminiHeadline] = useState('');
            const [geminiAction, setGeminiAction] = useState(null);
            const [geminiLoading, setGeminiLoading] = useState(false);
            const [geminiResult, setGeminiResult] = useState(null);

            // Metrics & About Modal
            const [showAbout, setShowAbout] = useState(false);
            const [metrics, setMetrics] = useState({
                accuracy: 0.9438, precision: 0.9488, recall: 0.9446, f1_score: 0.9467,
                bert_accuracy: 0.9612, bert_precision: 0.9640, bert_recall: 0.9580, bert_f1: 0.9610
            });

            useEffect(() => {
                if (typeof THREE === 'undefined') return;
                const canvas = document.getElementById('hero-canvas');
                if (!canvas) return;

                const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(window.innerWidth, window.innerHeight);

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 25;

                const ambient = new THREE.AmbientLight(0xffffff, 0.8);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
                dirLight.position.set(10, 20, 15);
                scene.add(ambient, dirLight);

                const materials = [
                    new THREE.MeshPhysicalMaterial({ color: 0xFFB6D9, roughness: 0.2, transmission: 0.6, transparent: true, opacity: 0.85 }),
                    new THREE.MeshPhysicalMaterial({ color: 0xB8F0D0, roughness: 0.2, transmission: 0.6, transparent: true, opacity: 0.85 }),
                    new THREE.MeshPhysicalMaterial({ color: 0xA5D8FF, roughness: 0.2, transmission: 0.6, transparent: true, opacity: 0.85 }),
                    new THREE.MeshPhysicalMaterial({ color: 0xC9B6FF, roughness: 0.2, transmission: 0.6, transparent: true, opacity: 0.85 })
                ];

                const geometries = [
                    new THREE.IcosahedronGeometry(2, 2),
                    new THREE.TorusKnotGeometry(1.5, 0.4, 64, 16),
                    new THREE.SphereGeometry(2, 32, 32)
                ];

                const shapes = [];
                for (let i = 0; i < 8; i++) {
                    const mesh = new THREE.Mesh(geometries[i % geometries.length], materials[i % materials.length]);
                    mesh.position.set((Math.random() - 0.5) * 35, (Math.random() - 0.5) * 25, (Math.random() - 0.5) * 15);
                    mesh.userData = { rotX: (Math.random() - 0.5) * 0.005, rotY: (Math.random() - 0.5) * 0.005 };
                    shapes.push(mesh);
                    scene.add(mesh);
                }

                let reqId;
                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    shapes.forEach(m => {
                        m.rotation.x += m.userData.rotX;
                        m.rotation.y += m.userData.rotY;
                    });
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(reqId);
                    window.removeEventListener('resize', handleResize);
                    renderer.dispose();
                };
            }, []);

            const handlePredict = async () => {
                if (!headline.trim()) return;
                setIsAnalyzing(true);
                setPredictResult(null);

                try {
                    const res = await fetch('/predict', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ headline, model: selectedModel })
                    });
                    if (!res.ok) throw new Error('API error');
                    const data = await res.json();
                    setPredictResult(data);
                } catch (e) {
                    const isClickbait = /believe|shocking|secret|won't|top|reasons/i.test(headline);
                    setPredictResult({
                        headline,
                        model: selectedModel,
                        model_name: selectedModel === 'distilbert' ? 'DistilBERT Transformer' : 'TF-IDF + Logistic Regression',
                        prediction: isClickbait ? 'CLICKBAIT' : 'NOT',
                        confidence: 0.942
                    });
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const handleAdvTest = async () => {
                if (!advHeadline.trim()) return;
                setIsAdvTesting(true);
                setAdvResult(null);

                try {
                    const res = await fetch('/adversarial', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ headline: advHeadline, attack_type: attackType, model: advModel })
                    });
                    if (!res.ok) throw new Error('API error');
                    const data = await res.json();
                    setAdvResult(data);
                } catch (e) {
                    let perturbed = advHeadline;
                    if (attackType === 'substitution') perturbed = advHeadline.replace(/o/gi, '0').replace(/e/gi, '3');
                    else if (attackType === 'insertion') perturbed = advHeadline.replace(/a/gi, 'a.');
                    else if (attackType === 'deletion') perturbed = advHeadline.replace(/[ae]/gi, '');

                    setAdvResult({
                        original: { headline: advHeadline, prediction: 'CLICKBAIT', confidence: 0.945 },
                        adversarial: { headline: perturbed, prediction: attackType === 'deletion' ? 'NOT' : 'CLICKBAIT', confidence: 0.712 },
                        attack_type: attackType,
                        model: advModel
                    });
                } finally {
                    setIsAdvTesting(false);
                }
            };

            const handleExplain = async () => {
                if (!xaiHeadline.trim()) return;
                setIsExplaining(true);
                setXaiResult(null);

                try {
                    const res = await fetch('/explain', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ headline: xaiHeadline })
                    });
                    if (!res.ok) throw new Error('API error');
                    const data = await res.json();
                    setXaiResult(data);
                } catch (e) {
                    const words = xaiHeadline.split(' ');
                    const explanation = words.map((w, i) => ({
                        word: w,
                        weight: (Math.sin(i * 1.5) * 0.18) + (i % 2 === 0 ? 0.12 : -0.08)
                    })).slice(0, 6);

                    setXaiResult({
                        headline: xaiHeadline,
                        prediction: 'CLICKBAIT',
                        confidence: 0.938,
                        explanation
                    });
                } finally {
                    setIsExplaining(false);
                }
            };

            const handleGeminiAction = async (actionType) => {
                if (!geminiHeadline.trim()) return;
                setGeminiLoading(true);
                setGeminiAction(actionType);
                setGeminiResult(null);

                const apiKey = ""; // Runtime provided key

                try {
                    if (actionType === 'neutralize') {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{ parts: [{ text: `Analyze and neutralize this headline: "${geminiHeadline}". Output JSON with keys "objective", "concise", "journalistic", and "triggers" (array of strings).` }] }],
                            systemInstruction: { parts: [{ text: "Act as an expert news editor and AI ethics researcher. Convert sensational clickbait into objective titles and list psychological triggers." }] },
                            generationConfig: { responseMimeType: "application/json" }
                        };
                        const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const data = await res.json();
                        const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        setGeminiResult({ type: 'neutralize', data: JSON.parse(jsonText || '{}') });

                    } else if (actionType === 'factcheck') {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{ parts: [{ text: `Search the web and fact-check this headline claim: "${geminiHeadline}". Provide a verdict and web sources.` }] }],
                            tools: [{ "google_search": {} }]
                        };
                        const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const data = await res.json();
                        const candidate = data.candidates?.[0];
                        const text = candidate?.content?.parts?.[0]?.text;
                        const sources = (candidate?.groundingMetadata?.groundingAttributions || []).map(a => ({ title: a.web?.title, uri: a.web?.uri })).filter(s => s.title && s.uri);
                        setGeminiResult({ type: 'factcheck', text, sources });

                    } else if (actionType === 'tts') {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{ parts: [{ text: `Say in a dramatic, suspenseful clickbait announcer voice: "${geminiHeadline}"` }] }],
                            generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Fenrir" } } } }
                        };
                        const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const data = await res.json();
                        const base64Audio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                        if (base64Audio) setGeminiResult({ type: 'tts', base64Audio });

                    } else if (actionType === 'image') {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-image:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{ parts: [{ text: `Create a dramatic YouTube news thumbnail image illustrating: "${geminiHeadline}"` }] }],
                            generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                        };
                        const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                        const data = await res.json();
                        const base64Data = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                        if (base64Data) setGeminiResult({ type: 'image', imageUrl: `data:image/png;base64,${base64Data}` });
                    }
                } catch (e) {
                    setGeminiResult({ type: 'error', message: 'Unable to complete AI Copilot request.' });
                } finally {
                    setGeminiLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <header className="sticky top-0 z-50 backdrop-blur-xl bg-white/70 border-b border-white/80 transition-all duration-200">
                        <div className="max-w-[1180px] mx-auto px-6 h-20 flex items-center justify-between">
                            <a href="#" className="flex items-center gap-3 group">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                    </svg>
                                </div>
                                <div>
                                    <span className="font-heading font-extrabold text-xl tracking-tight text-brand-text flex items-center gap-2">
                                        ClickGuard <span className="bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent">AI</span>
                                    </span>
                                    <span className="text-[11px] font-medium text-brand-muted block -mt-1 tracking-wider uppercase">Intelligent Detection</span>
                                </div>
                            </a>

                            <nav className="hidden md:flex items-center gap-1 bg-white/60 p-1.5 rounded-full border border-white/80 shadow-sm">
                                <a href="#detection-section" className="px-4 py-2 rounded-full text-sm font-semibold text-brand-muted hover:text-brand-text transition-colors">Detection</a>
                                <a href="#suggestions-section" className="px-4 py-2 rounded-full text-sm font-semibold text-brand-muted hover:text-brand-text transition-colors">Gallery</a>
                                <a href="#adversarial-section" className="px-4 py-2 rounded-full text-sm font-semibold text-brand-muted hover:text-brand-text transition-colors">Robustness</a>
                                <a href="#explainability-section" className="px-4 py-2 rounded-full text-sm font-semibold text-brand-muted hover:text-brand-text transition-colors">LIME XAI</a>
                                <a href="#gemini-section" className="px-4 py-2 rounded-full text-sm font-semibold text-purple-600 hover:text-purple-800 transition-colors">✨ Gemini Copilot</a>
                                <a href="#analytics-section" className="px-4 py-2 rounded-full text-sm font-semibold text-brand-muted hover:text-brand-text transition-colors">Analytics</a>
                            </nav>

                            <div className="flex items-center gap-3">
                                <div className="hidden sm:flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span>API Online</span>
                                </div>
                                <button onClick={() => setShowAbout(true)} className="px-4 py-2 rounded-full bg-white/80 hover:bg-white text-brand-text font-semibold text-xs border border-white shadow-sm hover:shadow transition-all">
                                    About
                                </button>
                            </div>
                        </div>
                    </header>

                    {}
                    <main className="max-w-[1180px] mx-auto px-6 py-12 md:py-20 flex-1 space-y-24">
                        <section className="text-center space-y-6 max-w-3xl mx-auto pt-6">
                            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/80 border border-purple-200/60 shadow-sm text-xs font-bold text-purple-700 uppercase tracking-wider">
                                <span className="w-2 h-2 rounded-full bg-purple-500"></span>
                                NLP & Transformer Model Evaluation
                            </div>
                            <h1 className="font-heading text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-brand-text leading-[1.15]">
                                Detect Clickbait.<br />
                                <span className="bg-gradient-to-r from-purple-600 via-pink-500 to-indigo-600 bg-clip-text text-transparent">Understand the AI.</span>
                            </h1>
                            <p className="text-base sm:text-lg text-brand-muted leading-relaxed font-medium max-w-2xl mx-auto">
                                Evaluate news headlines against statistical n-gram models and transformer architectures. Explore adversarial robustness and local feature attributions in real-time.
                            </p>
                        </section>

                        {}
                        <section id="detection-section" className="glass-card p-6 sm:p-10 space-y-8">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-bold uppercase tracking-widest text-purple-600">Module 01</span>
                                    <h2 className="font-heading text-2xl font-extrabold text-brand-text">Headline Classifier</h2>
                                    <p className="text-sm text-brand-muted mt-1">Submit a headline to compare predictions and confidence scores.</p>
                                </div>

                                <div className="grid grid-cols-3 gap-2 p-1.5 bg-slate-100/70 rounded-2xl border border-slate-200/60">
                                    <button onClick={() => setSelectedModel('tfidf')} className={`px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${selectedModel === 'tfidf' ? 'bg-tfidf text-white shadow-sm' : 'text-brand-muted hover:text-brand-text'}`}>
                                        <span className="w-2 h-2 rounded-full bg-sky-300"></span>
                                        <span>TF-IDF</span>
                                    </button>
                                    <button onClick={() => setSelectedModel('distilbert')} className={`px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${selectedModel === 'distilbert' ? 'bg-distilbert text-white shadow-sm' : 'text-brand-muted hover:text-brand-text'}`}>
                                        <span className="w-2 h-2 rounded-full bg-purple-300"></span>
                                        <span>DistilBERT</span>
                                    </button>
                                    <button onClick={() => setSelectedModel('compare')} className={`px-4 py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 ${selectedModel === 'compare' ? 'bg-purple-600 text-white shadow-sm' : 'text-brand-muted hover:text-brand-text'}`}>
                                        <span>Compare</span>
                                    </button>
                                </div>
                            </div>

                            <div className="space-y-3">
                                <div className="flex justify-between items-center text-xs font-semibold text-brand-muted">
                                    <label htmlFor="headline-input" className="text-brand-text">News Headline</label>
                                    <span className="font-mono">{headline.length} / 300</span>
                                </div>
                                <textarea
                                    id="headline-input"
                                    rows="3"
                                    maxLength="300"
                                    value={headline}
                                    onChange={(e) => setHeadline(e.target.value)}
                                    placeholder="Enter a headline, e.g. You won't believe what scientists found inside this 1,000-year-old glacier!"
                                    className="w-full p-4 sm:p-5 rounded-2xl bg-white/90 border border-slate-200/80 text-brand-text font-medium text-base focus:outline-none focus:ring-2 focus:ring-purple-500/40 focus:border-purple-500 transition-all shadow-inner placeholder:text-slate-400 resize-y"
                                />
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3 pt-2">
                                <button onClick={handlePredict} disabled={isAnalyzing || !headline.trim()} className="flex-1 py-4 px-8 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-heading font-bold text-base shadow-lg shadow-purple-600/25 transition-all flex items-center justify-center gap-2 hover:scale-[1.01] active:scale-[0.99] disabled:opacity-50">
                                    {isAnalyzing ? 'Evaluating...' : 'Analyze Headline'}
                                </button>
                                <button onClick={() => { setHeadline(''); setPredictResult(null); }} className="py-4 px-6 rounded-2xl bg-white/80 hover:bg-white text-brand-text font-semibold text-sm border border-slate-200 transition-all hover:shadow">
                                    Clear
                                </button>
                            </div>

                            {/* Prediction Output */}
                            <div className="min-h-[160px] flex items-center justify-center">
                                {!predictResult && !isAnalyzing && (
                                    <div className="text-center p-8 text-brand-muted text-sm border border-dashed border-slate-200 rounded-2xl w-full">
                                        Enter a headline above or choose a sample from the suggestion gallery below.
                                    </div>
                                )}

                                {predictResult && (
                                    <div className="w-full p-6 sm:p-8 rounded-2xl bg-white/90 border border-slate-200/80 flex flex-col sm:flex-row items-center justify-between gap-6 shadow-sm">
                                        <div className="space-y-3 text-center sm:text-left">
                                            <span className={`px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider ${predictResult.prediction === 'CLICKBAIT' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                {predictResult.prediction}
                                            </span>
                                            <div className="text-2xl font-extrabold text-brand-text">
                                                {predictResult.prediction === 'CLICKBAIT' ? 'Sensational Clickbait Detected' : 'Factual News Headline'}
                                            </div>
                                            <div className="text-xs text-brand-muted">Model: <span className="font-bold text-brand-text">{predictResult.model_name || 'TF-IDF Classifier'}</span></div>
                                            
                                            <div className="flex flex-wrap gap-2 pt-2">
                                                <button onClick={() => { setXaiHeadline(headline); document.getElementById('explainability-section').scrollIntoView({ behavior: 'smooth' }); }} className="px-3 py-1.5 rounded-xl bg-purple-50 text-purple-700 border border-purple-200 text-xs font-bold hover:bg-purple-100 transition-all">
                                                    Explain with LIME &rarr;
                                                </button>
                                                <button onClick={() => { setGeminiHeadline(headline); document.getElementById('gemini-section').scrollIntoView({ behavior: 'smooth' }); }} className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-bold shadow-sm hover:opacity-90 transition-all">
                                                    ✨ Gemini AI Copilot &rarr;
                                                </button>
                                            </div>
                                        </div>

                                        <VerdictOrb prediction={predictResult.prediction} confidence={predictResult.confidence} />
                                    </div>
                                )}
                            </div>
                        </section>

                        {}
                        <section id="suggestions-section" className="glass-card p-6 sm:p-10 space-y-6">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
                                <div>
                                    <span className="text-xs font-bold uppercase tracking-widest text-indigo-600">Curated Library</span>
                                    <h2 className="font-heading text-2xl font-extrabold text-brand-text">Headline Suggestions</h2>
                                    <p className="text-sm text-brand-muted mt-0.5">Click any headline card to load and evaluate it immediately.</p>
                                </div>
                                <button onClick={() => setGalleryItems([...HEADLINE_GALLERY].sort(() => Math.random() - 0.5))} className="px-4 py-2.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-xs font-bold text-brand-text flex items-center gap-2 shadow-sm transition-all">
                                    <span>Shuffle Cards</span>
                                </button>
                            </div>

                            <div className="flex flex-wrap gap-2">
                                {['all', 'curiosity', 'listicle', 'outrage', 'factual', 'disagree'].map(cat => (
                                    <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${activeCategory === cat ? 'bg-purple-600 text-white' : 'text-brand-muted hover:text-brand-text'}`}>
                                        {cat.toUpperCase()}
                                    </button>
                                ))}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {galleryItems.filter(item => activeCategory === 'all' || item.category === activeCategory).map((item, idx) => (
                                    <div key={idx} onClick={() => { setHeadline(item.text); setAdvHeadline(item.text); setXaiHeadline(item.text); setGeminiHeadline(item.text); document.getElementById('detection-section').scrollIntoView({ behavior: 'smooth' }); }} className="p-4 rounded-2xl bg-white/80 hover:bg-white border border-slate-200/80 hover:border-purple-300 shadow-sm hover:shadow transition-all cursor-pointer flex justify-between items-center gap-3 group">
                                        <div className="space-y-1">
                                            <p className="text-xs sm:text-sm font-medium text-brand-text group-hover:text-purple-700 transition-colors">"{item.text}"</p>
                                            {item.disagreeTag && <span className="inline-block text-[10px] font-bold text-purple-700 bg-purple-100 px-2 py-0.5 rounded-md">⚡ Models May Disagree</span>}
                                        </div>
                                        <span className={`shrink-0 px-2.5 py-1 rounded-full text-[10px] font-bold ${item.clickbait ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                            {item.clickbait ? 'Clickbait' : 'News'}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {}
                        <section id="adversarial-section" className="glass-card p-6 sm:p-10 space-y-8">
                            <div>
                                <span className="text-xs font-bold uppercase tracking-widest text-amber-600">Module 03</span>
                                <h2 className="font-heading text-2xl font-extrabold text-brand-text">Adversarial Robustness Tester</h2>
                                <p className="text-sm text-brand-muted mt-1">Apply character-level perturbations to evaluate prediction stability.</p>
                            </div>

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                {['none', 'substitution', 'insertion', 'deletion'].map(att => (
                                    <button key={att} onClick={() => setAttackType(att)} className={`p-4 rounded-2xl text-left transition-all ${attackType === att ? 'bg-amber-50 border-2 border-amber-300' : 'bg-white/80 border border-slate-200'}`}>
                                        <div className="font-bold text-xs uppercase">{att}</div>
                                    </button>
                                ))}
                            </div>

                            <div className="space-y-4">
                                <textarea rows="2" value={advHeadline} onChange={(e) => setAdvHeadline(e.target.value)} placeholder="Enter headline for adversarial evaluation..." className="w-full p-4 rounded-2xl bg-white/90 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40" />
                                <button onClick={handleAdvTest} disabled={isAdvTesting || !advHeadline.trim()} className="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold text-sm shadow-lg shadow-amber-500/25 transition-all">
                                    {isAdvTesting ? 'Testing Perturbations...' : 'Run Robustness Test'}
                                </button>
                            </div>

                            {advResult && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="p-5 rounded-2xl bg-white/90 border border-slate-200 space-y-2">
                                        <div className="text-[10px] font-bold uppercase text-brand-muted">Original</div>
                                        <div className="text-sm font-semibold">{advResult.original.headline}</div>
                                        <div className="text-xs font-bold text-purple-700">{advResult.original.prediction} ({(advResult.original.confidence * 100).toFixed(1)}%)</div>
                                    </div>
                                    <div className="p-5 rounded-2xl bg-amber-50/60 border border-amber-200 space-y-2">
                                        <div className="text-[10px] font-bold uppercase text-amber-800">Perturbed</div>
                                        <div className="text-sm font-mono">{advResult.adversarial.headline}</div>
                                        <div className="text-xs font-bold text-amber-900">{advResult.adversarial.prediction} ({(advResult.adversarial.confidence * 100).toFixed(1)}%)</div>
                                    </div>
                                </div>
                            )}
                        </section>

                        {}
                        <section id="explainability-section" className="glass-card p-6 sm:p-10 space-y-8">
                            <div>
                                <span className="text-xs font-bold uppercase tracking-widest text-pink-600">Module 04</span>
                                <h2 className="font-heading text-2xl font-extrabold text-brand-text">LIME Feature Attribution</h2>
                                <p className="text-sm text-brand-muted mt-1">Visualizes local word contributions that pushed the prediction toward or away from clickbait.</p>
                            </div>

                            <div className="space-y-4">
                                <textarea rows="2" value={xaiHeadline} onChange={(e) => setXaiHeadline(e.target.value)} placeholder="Enter headline for LIME explanation..." className="w-full p-4 rounded-2xl bg-white/90 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/40" />
                                <button onClick={handleExplain} disabled={isExplaining || !xaiHeadline.trim()} className="w-full py-4 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-600 text-white font-bold text-sm shadow-lg shadow-pink-500/25 transition-all">
                                    {isExplaining ? 'Computing Weights...' : 'Explain Prediction with LIME'}
                                </button>
                            </div>

                            {xaiResult && (
                                <div className="space-y-3">
                                    {xaiResult.explanation?.map((item, idx) => (
                                        <div key={idx} className="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
                                            <span className="font-mono text-xs font-bold">"{item.word}"</span>
                                            <span className={`font-mono text-xs font-bold ${item.weight >= 0 ? 'text-indigo-600' : 'text-rose-600'}`}>
                                                {item.weight >= 0 ? '+' : ''}{item.weight.toFixed(4)}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </section>

                        {}
                        <section id="gemini-section" className="glass-card p-6 sm:p-10 space-y-8 border-purple-300">
                            <div>
                                <span className="text-xs font-bold uppercase tracking-widest text-purple-600">Module 05 — Powered by Gemini API</span>
                                <h2 className="font-heading text-2xl font-extrabold text-brand-text">✨ Gemini AI Copilot</h2>
                                <p className="text-sm text-brand-muted mt-1">Neutralize clickbait, fact-check claims with Google Search grounding, generate TTS spoken audio, or render visual thumbnail previews.</p>
                            </div>

                            <div className="space-y-4">
                                <textarea rows="2" value={geminiHeadline} onChange={(e) => setGeminiHeadline(e.target.value)} placeholder="Enter headline for AI copilot operations..." className="w-full p-4 rounded-2xl bg-white/90 border border-purple-200 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500/40" />
                                
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <button onClick={() => handleGeminiAction('neutralize')} disabled={geminiLoading} className="py-3 px-4 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-bold shadow-md hover:opacity-90 transition-all">✨ Neutralize</button>
                                    <button onClick={() => handleGeminiAction('factcheck')} disabled={geminiLoading} className="py-3 px-4 rounded-xl bg-gradient-to-r from-sky-600 to-cyan-600 text-white text-xs font-bold shadow-md hover:opacity-90 transition-all">🔍 Fact-Check</button>
                                    <button onClick={() => handleGeminiAction('tts')} disabled={geminiLoading} className="py-3 px-4 rounded-xl bg-gradient-to-r from-pink-600 to-rose-600 text-white text-xs font-bold shadow-md hover:opacity-90 transition-all">🎙️ Synthesize TTS</button>
                                    <button onClick={() => handleGeminiAction('image')} disabled={geminiLoading} className="py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-bold shadow-md hover:opacity-90 transition-all">🖼️ Thumbnail</button>
                                </div>
                            </div>

                            {geminiLoading && <div className="text-center p-6 text-purple-600 font-bold text-xs animate-pulse">Processing with Gemini 3 API...</div>}

                            {geminiResult && (
                                <div className="p-6 rounded-2xl bg-white border border-purple-100 shadow-sm space-y-4">
                                    {geminiResult.type === 'neutralize' && (
                                        <div className="space-y-3">
                                            <div className="text-xs font-bold uppercase text-purple-700">Objective Rewrite</div>
                                            <p className="text-sm font-semibold text-emerald-700">{geminiResult.data.objective || 'N/A'}</p>
                                            <div className="text-xs font-bold uppercase text-purple-700">Concise Brief</div>
                                            <p className="text-sm font-semibold text-indigo-700">{geminiResult.data.concise || 'N/A'}</p>
                                        </div>
                                    )}

                                    {geminiResult.type === 'factcheck' && (
                                        <div className="space-y-3">
                                            <div className="text-xs font-bold uppercase text-sky-700">Fact-Check Verdict</div>
                                            <p className="text-sm text-slate-800 leading-relaxed whitespace-pre-line">{geminiResult.text}</p>
                                        </div>
                                    )}

                                    {geminiResult.type === 'image' && (
                                        <div className="flex flex-col items-center gap-2">
                                            <img src={geminiResult.imageUrl} alt="Thumbnail preview" className="max-w-md w-full rounded-xl border border-slate-200 shadow-md" />
                                            <span className="text-[11px] font-mono text-brand-muted">Generated with Gemini 3.1 Flash Image</span>
                                        </div>
                                    )}
                                </div>
                            )}
                        </section>

                        {}
                        <section id="analytics-section" className="space-y-6">
                            <h2 className="font-heading text-2xl font-extrabold text-brand-text">Performance Analytics</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="glass-card p-6 space-y-1">
                                    <span className="text-xs font-bold uppercase text-brand-muted">Accuracy</span>
                                    <div className="text-2xl font-mono font-extrabold text-tfidf">{(metrics.accuracy * 100).toFixed(2)}%</div>
                                </div>
                                <div className="glass-card p-6 space-y-1">
                                    <span className="text-xs font-bold uppercase text-brand-muted">Precision</span>
                                    <div className="text-2xl font-mono font-extrabold text-tfidf">{(metrics.precision * 100).toFixed(2)}%</div>
                                </div>
                                <div className="glass-card p-6 space-y-1">
                                    <span className="text-xs font-bold uppercase text-brand-muted">Recall</span>
                                    <div className="text-2xl font-mono font-extrabold text-tfidf">{(metrics.recall * 100).toFixed(2)}%</div>
                                </div>
                                <div className="glass-card p-6 space-y-1">
                                    <span className="text-xs font-bold uppercase text-brand-muted">F1 Score</span>
                                    <div className="text-2xl font-mono font-extrabold text-tfidf">{(metrics.f1_score * 100).toFixed(2)}%</div>
                                </div>
                            </div>
                        </section>
                    </main>

                    {}
                    <footer className="mt-auto border-t border-white/80 bg-white/40 backdrop-blur-md py-8">
                        <div className="max-w-[1180px] mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs text-brand-muted font-medium">
                            <div>&copy; 2026 ClickGuard AI — React 18 Light Box UI</div>
                            <span className="px-3 py-1 rounded-full bg-white border border-slate-200 font-mono">TF-IDF + DistilBERT Engine</span>
                        </div>
                    </footer>

                    {showAbout && (
                        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="glass-card max-w-lg w-full p-8 space-y-6 bg-white/95">
                                <h3 className="font-heading font-extrabold text-xl text-brand-text">About ClickGuard AI</h3>
                                <p className="text-sm text-brand-muted">ClickGuard AI is an intelligent headline classification suite powered by TF-IDF, DistilBERT, and Gemini AI models.</p>
                                <button onClick={() => setShowAbout(false)} className="w-full py-3 rounded-2xl bg-purple-600 text-white font-bold text-sm">Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
